name: Check scripting-addition version

on:
  push:
    branches: [master]
    paths: ['src/osax/**']
  pull_request:
    paths: ['src/osax/**']

jobs:
  check-osax-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OSAX_VERSION must change with the payload
        run: scripts/check-osax-version.sh
